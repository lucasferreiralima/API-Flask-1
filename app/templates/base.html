<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VettoreFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('web.index') }}" class="brand">VettoreFlow</a>
            <div class="links">
                <a href="{{ url_for('web.index') }}">Dashboard</a>
                <a href="{{ url_for('web.listar_operacoes') }}">Operações</a>
                <a href="{{ url_for('web.listar_pendencias') }}">Pendências</a>
                <a href="{{ url_for('web.importar') }}">Importar</a>
                <a href="{{ url_for('web.nova_operacao') }}" class="btn-nav">Nova Operação</a>
                <a href="/api/health" target="_blank">Health</a>
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 VettoreFlow - Gestão Operacional e Comercial</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
